<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1a3a5c"/>
    </linearGradient>
  </defs>

  <rect width="100" height="100" rx="22" fill="url(#bg)"/>
  <rect x="2" y="2" width="96" height="96" rx="20" fill="none" stroke="#3b82d4" stroke-opacity=".35" stroke-width="2"/>

  <!-- ECG / pulse trace -->
  <polyline points="8,54 26,54 33,32 42,74 51,18 60,54 92,54"
            fill="none" stroke="#eaf2fb" stroke-width="6.5"
            stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="8,54 26,54 33,32 42,74 51,18 60,54 92,54"
            fill="none" stroke="#3b82d4" stroke-width="6.5" stroke-opacity=".55"
            stroke-linecap="round" stroke-linejoin="round"
            transform="translate(0,1.4)"/>

  <!-- live status dot -->
  <circle cx="82" cy="20" r="7" fill="#22c55e"/>
  <circle cx="82" cy="20" r="7" fill="none" stroke="#0d1b2a" stroke-width="2.5"/>
</svg>
